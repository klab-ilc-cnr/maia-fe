<p-tabs [(value)]="selectedTab" [scrollable]="true">
    <p-tablist>
        <p-tab [value]="0">{{('ONTOLOGY.annotations'|translate)}}</p-tab>
        <p-tab [value]="1">{{('ONTOLOGY.usage'|translate)}}</p-tab>
    </p-tablist>
    <p-tabpanels>
        <p-tabpanel [value]="0">
            <app-ontology-class-viewer *ngIf="visibleTileType === TileType.ONTOLOGY_CLASS_VIEWER" [classId]="id"></app-ontology-class-viewer>
            <app-ontology-object-property-viewer *ngIf="visibleTileType === TileType.ONTOLOGY_OBJECT_PROPERTY_VIEWER" [propertyId]="id"></app-ontology-object-property-viewer>
            <app-ontology-data-property-viewer *ngIf="visibleTileType === TileType.ONTOLOGY_DATA_PROPERTY_VIEWER" [propertyId]="id"></app-ontology-data-property-viewer>
            <app-ontology-individual-viewer *ngIf="visibleTileType === TileType.ONTOLOGY_INDIVIDUAL_VIEWER" [instanceId]="id"></app-ontology-individual-viewer>
        </p-tabpanel>
        <p-tabpanel [value]="1">
            <app-ontology-tab-usage [id]="id"></app-ontology-tab-usage>
        </p-tabpanel>
    </p-tabpanels>
</p-tabs>
